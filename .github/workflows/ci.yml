name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gcc:
    name: GCC (ASan + UBSan, Warnungen als Fehler)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Konfigurieren
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DWHITEHOLEFX_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined"
      - name: Bauen
        run: cmake --build build --parallel
      - name: Testen
        run: ctest --test-dir build --output-on-failure

  clang:
    name: Clang (Fehler hier brechen den Lauf nicht ab)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Konfigurieren
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++
      - name: Bauen
        run: cmake --build build --parallel
      - name: Testen
        run: ctest --test-dir build --output-on-failure

  gpu:
    name: GPU-Backend (wgpu-native + Software-Vulkan, experimentell)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Software-Vulkan installieren (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools unzip
          vulkaninfo --summary || true
      - name: wgpu-native laden (Header und Bibliothek aus demselben Paket)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gfx-rs/wgpu-native --pattern 'wgpu-linux-x86_64-release.zip' --dir dl
          unzip -q dl/wgpu-linux-x86_64-release.zip -d wgpu
          ls -R wgpu | head -30
      - name: Konfigurieren
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DWHITEHOLEFX_WEBGPU=ON -DWGPU_NATIVE_ROOT="$PWD/wgpu"
      - name: Bauen
        run: cmake --build build --parallel --target wh_gpu_tests whitehole_cli
      - name: Testen
        run: ./build/tests/wh_gpu_tests
      - name: Runner mit echtem Gerät (20 Frames, Software-Adapter)
        run: |
          ./build/apps/whitehole_cli/whitehole_cli examples/wand.whfx --check
          ./build/apps/whitehole_cli/whitehole_cli examples/wand.whfx --frames 20 --software
      - name: Vorschau-Bilder erzeugen (echter Effekt auf dem Software-Adapter)
        run: |
          ./build/apps/whitehole_cli/whitehole_cli examples/wand.whfx --frames 60 --software --snapshot vorschau.png
          ./build/apps/whitehole_cli/whitehole_cli examples/wand.whfx --check --snapshot layout.png
          test -s vorschau.png && test -s layout.png
      - name: Vorschau-Bilder bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: vorschau
          path: |
            vorschau.png
            layout.png

  windows:
    name: Windows (MSVC, experimentell, Fehler brechen den Lauf nicht ab)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Konfigurieren
        run: cmake -S . -B build
      - name: Bauen
        run: cmake --build build --config Debug --parallel
      - name: Testen
        # Die Ausgabe wird zusätzlich als Meldung (Annotation) ausgegeben, damit sie ohne Log-Download lesbar ist.
        run: |
          $out = (& ./build/tests/Debug/wh_tests.exe --reporter compact 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $tail = $out.Substring([Math]::Max(0, $out.Length - 6000))
          Write-Output $out
          $msg = "Exit-Code $code`n" + $tail
          $msg = $msg -replace "`r?`n", "%0A"
          $level = if ($code -eq 0) { "notice" } else { "error" }
          Write-Output "::$level title=Testausgabe::$msg"
          exit $code

  windows-gpu:
    name: Windows GPU-Backend (wgpu-native, experimentell)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: wgpu-native laden (Header und Bibliothek aus demselben Paket)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gfx-rs/wgpu-native --pattern 'wgpu-windows-x86_64-msvc-release.zip' --dir dl
          Expand-Archive dl/wgpu-windows-x86_64-msvc-release.zip -DestinationPath wgpu
          Get-ChildItem -Recurse wgpu | Select-Object -First 30 FullName
      - name: Konfigurieren
        run: cmake -S . -B build -DWHITEHOLEFX_WEBGPU=ON "-DWGPU_NATIVE_ROOT=$PWD/wgpu"
      - name: Bauen
        run: cmake --build build --config Debug --parallel --target wh_gpu_tests whitehole_cli
      - name: Testen
        run: |
          $out = (& ./build/tests/Debug/wh_gpu_tests.exe 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $tail = $out.Substring([Math]::Max(0, $out.Length - 6000))
          Write-Output $out
          $msg = "Exit-Code $code`n" + $tail
          $msg = $msg -replace "`r?`n", "%0A"
          Write-Output "::notice title=GPU-Testausgabe::$msg"
          exit $code
      - name: Runner mit echtem Gerät (20 Frames)
        run: |
          ./build/apps/whitehole_cli/Debug/whitehole_cli.exe examples/wand.whfx --check
          ./build/apps/whitehole_cli/Debug/whitehole_cli.exe examples/wand.whfx --frames 20

  studio:
    name: Oberfläche (Qt 6, offscreen, Software-Vulkan, experimentell)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Qt, Software-Vulkan und Schriften installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev libxkbcommon-dev fonts-dejavu-core \
            mesa-vulkan-drivers libvulkan1 vulkan-tools unzip
      - name: wgpu-native laden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gfx-rs/wgpu-native --pattern 'wgpu-linux-x86_64-release.zip' --dir dl
          unzip -q dl/wgpu-linux-x86_64-release.zip -d wgpu
      - name: Konfigurieren
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DWHITEHOLEFX_BUILD_STUDIO=ON -DWHITEHOLEFX_WEBGPU=ON -DWGPU_NATIVE_ROOT="$PWD/wgpu"
      - name: Bauen
        run: cmake --build build --parallel --target whitehole_studio
      - name: Fenster ohne Bildschirm öffnen und Bilder speichern
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build/apps/whitehole_studio/whitehole_studio examples/wand.whfx --grab fenster-layout.png
          ./build/apps/whitehole_studio/whitehole_studio examples/wand.whfx --run --software --frames 40 --grab fenster-lauf.png
          test -s fenster-layout.png && test -s fenster-lauf.png
      - name: Fensterbilder bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: fenster
          path: |
            fenster-layout.png
            fenster-lauf.png
