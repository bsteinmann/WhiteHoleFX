name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gcc:
    name: GCC (ASan + UBSan, Warnungen als Fehler)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Konfigurieren
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DWHITEHOLEFX_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined"
      - name: Bauen
        run: cmake --build build --parallel
      - name: Testen
        run: ctest --test-dir build --output-on-failure

  clang:
    name: Clang (Fehler hier brechen den Lauf nicht ab)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Konfigurieren
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++
      - name: Bauen
        run: cmake --build build --parallel
      - name: Testen
        run: ctest --test-dir build --output-on-failure

  gpu:
    name: GPU-Backend (wgpu-native + Software-Vulkan, experimentell)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Software-Vulkan installieren (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools unzip
          vulkaninfo --summary || true
      - name: wgpu-native laden (Header und Bibliothek aus demselben Paket)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gfx-rs/wgpu-native --pattern 'wgpu-linux-x86_64-release.zip' --dir dl
          unzip -q dl/wgpu-linux-x86_64-release.zip -d wgpu
          ls -R wgpu | head -30
      - name: Konfigurieren
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DWHITEHOLEFX_WEBGPU=ON -DWGPU_NATIVE_ROOT="$PWD/wgpu"
      - name: Bauen
        run: cmake --build build --parallel --target wh_gpu_tests
      - name: Testen
        run: ./build/tests/wh_gpu_tests

  windows:
    name: Windows (MSVC, experimentell, Fehler brechen den Lauf nicht ab)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Konfigurieren
        run: cmake -S . -B build
      - name: Bauen
        run: cmake --build build --config Debug --parallel
      - name: Testen
        # Die Ausgabe wird zusätzlich als Meldung (Annotation) ausgegeben, damit sie ohne Log-Download lesbar ist.
        run: |
          $out = (& ./build/tests/Debug/wh_tests.exe --reporter compact 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $tail = $out.Substring([Math]::Max(0, $out.Length - 6000))
          Write-Output $out
          $msg = "Exit-Code $code`n" + $tail
          $msg = $msg -replace "`r?`n", "%0A"
          Write-Output "::error title=Testausgabe::$msg"
          exit $code

  windows-gpu:
    name: Windows GPU-Backend (wgpu-native, experimentell)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: wgpu-native laden (Header und Bibliothek aus demselben Paket)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gfx-rs/wgpu-native --pattern 'wgpu-windows-x86_64-msvc-release.zip' --dir dl
          Expand-Archive dl/wgpu-windows-x86_64-msvc-release.zip -DestinationPath wgpu
          Get-ChildItem -Recurse wgpu | Select-Object -First 30 FullName
      - name: Konfigurieren
        run: cmake -S . -B build -DWHITEHOLEFX_WEBGPU=ON "-DWGPU_NATIVE_ROOT=$PWD/wgpu"
      - name: Bauen
        run: cmake --build build --config Debug --parallel --target wh_gpu_tests
      - name: Testen
        run: |
          $out = (& ./build/tests/Debug/wh_gpu_tests.exe 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $tail = $out.Substring([Math]::Max(0, $out.Length - 6000))
          Write-Output $out
          $msg = "Exit-Code $code`n" + $tail
          $msg = $msg -replace "`r?`n", "%0A"
          Write-Output "::notice title=GPU-Testausgabe::$msg"
          exit $code
