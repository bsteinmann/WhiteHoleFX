name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gcc:
    name: GCC (ASan + UBSan, Warnungen als Fehler)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Konfigurieren
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DWHITEHOLEFX_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined"
      - name: Bauen
        run: cmake --build build --parallel
      - name: Testen
        run: ctest --test-dir build --output-on-failure

  clang:
    name: Clang (Fehler hier brechen den Lauf nicht ab)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Konfigurieren
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++
      - name: Bauen
        run: cmake --build build --parallel
      - name: Testen
        run: ctest --test-dir build --output-on-failure

  gpu:
    name: GPU-Backend (wgpu-native + Software-Vulkan, experimentell)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Software-Vulkan installieren (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools unzip
          vulkaninfo --summary || true
      - name: wgpu-native laden (Header und Bibliothek aus demselben Paket, Version gepinnt)
        run: scripts/fetch-wgpu-native.sh
      - name: Konfigurieren
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DWHITEHOLEFX_WEBGPU=ON -DWGPU_NATIVE_ROOT="$PWD/third_party/wgpu-native"
      - name: Bauen
        run: cmake --build build --parallel --target wh_gpu_tests whitehole_cli
      - name: Testen
        run: ./build/tests/wh_gpu_tests
      - name: Runner mit echtem Gerät (20 Frames, Software-Adapter)
        run: |
          ./build/apps/whitehole_cli/whitehole_cli examples/wand.whfx --check
          ./build/apps/whitehole_cli/whitehole_cli examples/wand.whfx --frames 20 --software
      - name: Vorschau-Bilder erzeugen (echter Effekt auf dem Software-Adapter)
        run: |
          ./build/apps/whitehole_cli/whitehole_cli examples/wand.whfx --frames 60 --software --snapshot vorschau.png
          ./build/apps/whitehole_cli/whitehole_cli examples/wand.whfx --check --snapshot layout.png
          test -s vorschau.png && test -s layout.png
      - name: Vorschau-Bilder bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: vorschau
          path: |
            vorschau.png
            layout.png

  windows:
    name: Windows (MSVC, experimentell, Fehler brechen den Lauf nicht ab)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Konfigurieren
        run: cmake -S . -B build
      - name: Bauen
        run: cmake --build build --config Debug --parallel
      - name: Testen
        # Die Ausgabe wird zusätzlich als Meldung (Annotation) ausgegeben, damit sie ohne Log-Download lesbar ist.
        run: |
          $out = (& ./build/tests/Debug/wh_tests.exe --reporter compact 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $tail = $out.Substring([Math]::Max(0, $out.Length - 6000))
          Write-Output $out
          $msg = "Exit-Code $code`n" + $tail
          $msg = $msg -replace "`r?`n", "%0A"
          $level = if ($code -eq 0) { "notice" } else { "error" }
          Write-Output "::$level title=Testausgabe::$msg"
          exit $code

  windows-gpu:
    name: Windows GPU-Backend (wgpu-native, experimentell)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: wgpu-native laden (Header und Bibliothek aus demselben Paket, Version gepinnt)
        run: ./scripts/fetch-wgpu-native.ps1
      - name: Konfigurieren
        run: cmake -S . -B build -DWHITEHOLEFX_WEBGPU=ON "-DWGPU_NATIVE_ROOT=$PWD/third_party/wgpu-native"
      - name: Bauen
        run: cmake --build build --config Debug --parallel --target wh_gpu_tests whitehole_cli
      - name: Testen
        run: |
          $out = (& ./build/tests/Debug/wh_gpu_tests.exe 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $tail = $out.Substring([Math]::Max(0, $out.Length - 6000))
          Write-Output $out
          $msg = "Exit-Code $code`n" + $tail
          $msg = $msg -replace "`r?`n", "%0A"
          Write-Output "::notice title=GPU-Testausgabe::$msg"
          exit $code
      - name: Runner mit echtem Gerät (20 Frames)
        run: |
          ./build/apps/whitehole_cli/Debug/whitehole_cli.exe examples/wand.whfx --check
          ./build/apps/whitehole_cli/Debug/whitehole_cli.exe examples/wand.whfx --frames 20

  studio:
    name: Oberfläche (Qt 6, offscreen, Software-Vulkan, experimentell)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Qt, Software-Vulkan und Schriften installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev libxkbcommon-dev fonts-dejavu-core \
            mesa-vulkan-drivers libvulkan1 vulkan-tools unzip
      - name: wgpu-native laden
        run: scripts/fetch-wgpu-native.sh
      - name: Konfigurieren
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DWHITEHOLEFX_BUILD_STUDIO=ON -DWHITEHOLEFX_WEBGPU=ON -DWGPU_NATIVE_ROOT="$PWD/third_party/wgpu-native"
      - name: Bauen
        # Compilerfehler zusätzlich als Annotation ausgeben, damit sie ohne Log-Download lesbar sind.
        run: |
          set +e
          cmake --build build --parallel --target whitehole_studio 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            msg=$(grep -E "error|Error|undefined reference|fatal" -A3 build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Buildfehler::${msg}"
          fi
          exit $code
      - name: Fenster ohne Bildschirm öffnen und Bilder speichern
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Ausgabe sammeln und bei Fehlern als Annotation zeigen (Logs sind von außen nicht lesbar).
          studio=./build/apps/whitehole_studio/whitehole_studio
          fail=0
          run_studio() {
            code=0; out=$("$studio" "$@" 2>&1) || code=$?
            echo "$out"
            if [ "$code" != "0" ]; then
              msg=$(echo "$out" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=Fenster-Lauf fehlgeschlagen::Code $code, Argumente $*%0A${msg}"
              fail=1
            fi
          }
          run_studio examples/wand.whfx --grab fenster-layout.png
          run_studio examples/wand.whfx --run --software --frames 40 --grab fenster-lauf.png
          run_studio examples/regler.whfx --run --software --frames 40 --exercise --grab fenster-regler.png
          test -s fenster-layout.png && test -s fenster-lauf.png && test -s fenster-regler.png || fail=1
          exit $fail
      - name: Fensterbilder bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: fenster
          path: |
            fenster-layout.png
            fenster-lauf.png
            fenster-regler.png

  windows-studio:
    name: Windows Oberfläche (Qt 6, MSVC, fertiges Paket als Artefakt, experimentell)
    runs-on: windows-latest
    continue-on-error: true
    env:
      QT_VERSION: "6.8.3"
    steps:
      - uses: actions/checkout@v5
      - name: Qt installieren (aqtinstall)
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 --outputdir C:\Qt
      - name: wgpu-native laden
        run: ./scripts/fetch-wgpu-native.ps1
      - name: Konfigurieren
        run: >
          cmake -S . -B build -DWHITEHOLEFX_BUILD_STUDIO=ON -DWHITEHOLEFX_WEBGPU=ON
          "-DWGPU_NATIVE_ROOT=$PWD/third_party/wgpu-native"
          "-DCMAKE_PREFIX_PATH=C:/Qt/$env:QT_VERSION/msvc2022_64"
      - name: Bauen (Release)
        # Fehler zusätzlich als Annotation ausgeben, damit sie ohne Log-Download lesbar sind.
        run: |
          $out = (cmake --build build --config Release --parallel 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) {
            $errors = ($out -split "`r?`n" | Where-Object { $_ -match "error|fatal|LNK" } | Select-Object -First 25) -join "`n"
            $msg = $errors -replace "`r?`n", "%0A"
            Write-Output "::error title=Buildfehler::$msg"
          }
          exit $code
      - name: Tests
        run: |
          $out = (& ./build/tests/Release/wh_tests.exe --reporter compact 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Output $out
          $tail = $out.Substring([Math]::Max(0, $out.Length - 3000)) -replace "`r?`n", "%0A"
          $level = if ($code -eq 0) { "notice" } else { "error" }
          Write-Output "::$level title=Testausgabe::Exit-Code $code%0A$tail"
          exit $code
      - name: Fenster ohne Bildschirm öffnen (Rauchtest mit Reglern, Node-Editor, Layout, Rückgängig)
        env:
          QT_QPA_PLATFORM: offscreen
          PATH_QT: C:\Qt\6.8.3\msvc2022_64\bin
        run: |
          $env:PATH = "$env:PATH_QT;$env:PATH"
          $exe = "./build/apps/whitehole_studio/Release/whitehole_studio.exe"
          # Ohne GPU-Lauf: Das Fenster, alle Formulare und der Editor werden bedient.
          $p = Start-Process -FilePath $exe -ArgumentList "examples/regler.whfx","--exercise","--grab","fenster-regler.png" -Wait -PassThru
          Write-Output "::notice title=Rauchtest ohne Lauf::Exit-Code $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          # Mit Lauf auf dem Software-Adapter, falls einer da ist (kein Fehler, wenn nicht).
          $p2 = Start-Process -FilePath $exe -ArgumentList "examples/regler.whfx","--run","--software","--frames","30","--exercise","--grab","fenster-lauf.png" -Wait -PassThru
          Write-Output "::notice title=Rauchtest mit Lauf::Exit-Code $($p2.ExitCode)"
          if (-not (Test-Path fenster-regler.png)) { exit 1 }
      - name: Paket schnüren (windeployqt)
        run: |
          $env:PATH = "C:\Qt\$env:QT_VERSION\msvc2022_64\bin;$env:PATH"
          New-Item -ItemType Directory -Force -Path paket/WhiteHoleFX | Out-Null
          Copy-Item build/apps/whitehole_studio/Release/* paket/WhiteHoleFX/ -Recurse
          Copy-Item build/apps/whitehole_cli/Release/whitehole_cli.exe paket/WhiteHoleFX/
          Copy-Item examples paket/WhiteHoleFX/examples -Recurse
          Copy-Item README.md, BUILDING.md paket/WhiteHoleFX/
          windeployqt --release --no-translations paket/WhiteHoleFX/whitehole_studio.exe
          Get-ChildItem paket/WhiteHoleFX | Select-Object -First 40 Name
      - name: Paket bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: WhiteHoleFX-Windows
          path: paket
      - name: Fensterbilder bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: fenster-windows
          path: fenster-*.png

  linux-package:
    name: Linux-Paket (.deb für Ubuntu 24.04, Installationstest in sauberem Container)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Bauwerkzeuge, Qt und desktop-file-utils installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev libxkbcommon-dev dpkg-dev \
            desktop-file-utils shared-mime-info libxml2-utils unzip curl
      - name: wgpu-native laden
        run: scripts/fetch-wgpu-native.sh
      - name: Konfigurieren (Release, Präfix /usr)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          -DWHITEHOLEFX_BUILD_STUDIO=ON -DWHITEHOLEFX_WEBGPU=ON -DWHITEHOLEFX_BUILD_TESTS=OFF
          -DWGPU_NATIVE_ROOT="$PWD/third_party/wgpu-native"
      - name: Bauen
        run: cmake --build build --parallel
      - name: Starter und Dateityp prüfen
        run: |
          desktop-file-validate packaging/linux/whitehole-studio.desktop
          xmllint --noout packaging/linux/whiteholefx-mime.xml packaging/linux/whiteholefx.svg
      - name: Paket erzeugen
        # Fehler zusätzlich als Annotation ausgeben, damit sie ohne Log-Download lesbar sind.
        run: |
          set +e
          (cd build && cpack -G DEB) 2>&1 | tee cpack.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            msg=$(tail -40 cpack.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cpack fehlgeschlagen::${msg}"
          fi
          exit $code
      - name: Paketinhalt und Abhängigkeiten anzeigen
        run: |
          mkdir -p dist
          cp build/*.deb dist/
          deb=$(ls dist/*.deb)
          info="$(dpkg-deb --info "$deb" | grep -E 'Package|Version|Architecture|Depends|Recommends|Installed-Size')"
          files="$(dpkg-deb --contents "$deb" | awk '{print $1, $3, $6}' | head -60)"
          msg=$(printf '%s\n%s\n' "$info" "$files" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Paket::${msg}"
          echo "$info"; echo "$files"
      - name: Installationstest in sauberem Ubuntu 24.04 (Abhängigkeiten, Start, Rauchtest)
        run: |
          set +e
          out=$(docker run --rm -v "$PWD/dist:/dist:ro" -e QT_QPA_PLATFORM=offscreen ubuntu:24.04 bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq /dist/*.deb mesa-vulkan-drivers fonts-dejavu-core > /dev/null
            echo "== installiert:"; dpkg -L whiteholefx | head -40
            echo "== Version:"; whitehole_studio --version
            echo "== Prüfung:"; whitehole_cli /usr/share/whiteholefx/examples/wand.whfx --check
            echo "== Rendern:"; whitehole_cli /usr/share/whiteholefx/examples/wand.whfx --frames 20 --software
            echo "== Fenster:"; whitehole_studio /usr/share/whiteholefx/examples/regler.whfx --run --software --frames 30 --exercise --grab /tmp/fenster.png
            test -s /tmp/fenster.png
            echo "== Entfernen:"; apt-get remove -y -qq whiteholefx > /dev/null; test ! -e /usr/bin/whitehole_studio
            echo ALLES-OK
          ' 2>&1)
          code=$?
          echo "$out"
          msg=$(echo "$out" | tail -45 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          if [ "$code" != "0" ]; then echo "::error title=Installationstest fehlgeschlagen::${msg}"; else echo "::notice title=Installationstest::${msg}"; fi
          exit $code
      - name: Paket bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: WhiteHoleFX-Linux-deb
          path: dist/*.deb
